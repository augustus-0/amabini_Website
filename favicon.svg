<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Solid white circle background to match the inverted branding -->
  <circle cx="12" cy="12" r="12" fill="#ffffff" />
  
  <defs>
    <mask id="fav-mask" maskUnits="userSpaceOnUse">
      <!-- Outer white star (visible part) -->
      <path d="M12 2L15 9H22L16.5 14L18.5 21L12 17L5.5 21L7.5 14L2 9H9L12 2Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
      <!-- Inner black stick figure cutout (transparent hole, moved higher and scaled smaller) -->
      <circle cx="12" cy="8.5" r="1.2" fill="#000000" />
      <path d="M12 10V12.5" stroke="#000000" stroke-width="2" stroke-linecap="round" />
      <path d="M9.5 11H14.5" stroke="#000000" stroke-width="2" stroke-linecap="round" />
      <path d="M12 12.5L10.5 14.5M12 12.5L13.5 14.5" stroke="#000000" stroke-width="2" stroke-linecap="round" />
    </mask>
  </defs>
  
  <!-- Star scaled up to 92% (translate 1,1) to sit beautifully and match the larger website padding -->
  <g transform="translate(1, 1) scale(0.92)">
    <path d="M12 2L15 9H22L16.5 14L18.5 21L12 17L5.5 21L7.5 14L2 9H9L12 2Z" fill="#1a1b26" stroke="#1a1b26" stroke-width="1" mask="url(#fav-mask)" stroke-linejoin="round" />
  </g>
</svg>
